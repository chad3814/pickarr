services:
  pickarr:
    build: .
    ports:
      - "7676:7676"
    volumes:
      - ./config:/config
    environment:
      # The user the container runs as, so everything it writes into
      # ./config belongs to you rather than to root. `id -u` and `id -g`
      # print the pair you want. Remove both to run as root, which is what
      # this image did before these existed.
      PUID: 1000
      PGID: 1000
    secrets:
      # Each name here is also the filename the host looks for under
      # `secrets.baseDir` (`/run/secrets` by default), because Docker mounts
      # a secret at `/run/secrets/<name>`. So the name below IS the lookup
      # name -- lowercase and hyphenated, never the uppercase environment
      # spelling.
      - openmetadata-api-key
      # Optional. Each buys artwork from the provider that identified a
      # release; without one, that provider's cards carry no image and the
      # job says so once. See README's Secrets section.
      - tmdb-read-access-token
      - tpdb-api-key
      - tvdb-api-key
    restart: unless-stopped

secrets:
  openmetadata-api-key:
    file: ./secrets/openmetadata-api-key
  tmdb-read-access-token:
    file: ./secrets/tmdb-read-access-token
  tpdb-api-key:
    file: ./secrets/tpdb-api-key
  tvdb-api-key:
    file: ./secrets/tvdb-api-key
