<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/pickarr.ico" sizes="16x16 32x32 48x48 64x64 128x128 256x256" />
    <link rel="icon" type="image/png" sizes="16x16" href="/pickarr-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/pickarr-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/pickarr-48x48.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/pickarr-64x64.png" />
    <link rel="icon" type="image/png" sizes="128x128" href="/pickarr-128x128.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="/pickarr-256x256.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pickarr-512x512.png" />
    <link rel="apple-touch-icon" sizes="256x256" href="/pickarr-256x256.png" />
    <title>Pickarr</title>
    <!--
      Inline and synchronous because it has to beat first paint. The module
      script below is deferred by definition, so leaving this to React means
      painting the wrong theme and then correcting it, in view.

      It duplicates three lines of `src/theme.ts` deliberately: importing the
      module here would make this a second module graph fetched before paint,
      which is the very thing it exists to avoid. `pickarr.theme` and
      `(prefers-color-scheme: light)` are the contract, and `theme.ts` exports
      both so they are stated in one place and copied here knowingly.
    -->
    <script>
      try {
        var stored = localStorage.getItem('pickarr.theme');
        document.documentElement.setAttribute(
          'data-theme',
          stored === 'light' || stored === 'dark'
            ? stored
            : matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark',
        );
      } catch (cause) {
        // localStorage throws on access outright in some privacy
        // configurations. Dark is the default identity, so fall to it.
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
